# Frosted-blur for the Dynamic Island.
#
# Current Hyprland rejects runtime `hyprctl keyword layerrule`, so enable blur
# by sourcing this file from your hyprland config — the path depends on where
# the shell config lives on your install (repo checkout, ~/.config/quickshell,
# or a nix store path):
#
#   source = <path-to-shell-config>/Modules/DynamicIsland/island-blur.conf
#
# (or copy the three rules below inline). Then turn on Settings → Bar →
# "Frosted blur" (or set dynamicIslandBlur=true).

layerrule = blur, dms:dynamic-island
layerrule = ignorealpha 0.15, dms:dynamic-island
layerrule = xray 0, dms:dynamic-island
